<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="할 일을 퀘스트로 바꿔 주는 게임형 플래너">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151733">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7eaff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QUESTLINE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>QUESTLINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: a two-pane game HUD. Hero status window on the left, quest board on the right; one column on phones. */
:root{
  --bg:#151733; --bg-dot:#20234a; --panel:#1e2147; --panel-2:#272b57; --line:#3a4086; --depth:#0b0d22;
  --ink:#f2f3ff; --muted:#a6abd8; --faint:#6d73ab; --outline:#0b0d22;
  --gold:#ffc83d; --gold-deep:#b98000; --gold-ink:#2b1d00;
  --accent:#ff7657; --accent-deep:#b0402a; --accent-ink:#2a0d05;
  --good:#4fd6a0; --warn:#ffb648; --bad:#ff5d73; --bad-ink:#2a0710;
  --c-body:#ff6b6b; --c-mind:#5fa8ff; --c-heart:#b98cff; --on-stat:#140f2b;
  --habit:#3fd0b0; --habit-ink:#3fd0b0;
  --r-c:#c9cfe8; --r-r:#5ec8ff; --r-e:#c084ff;
  --wk-band:rgba(88,98,214,.62); --wk-band-hi:rgba(108,118,232,.78);
  --scrim:rgba(8,9,24,.74);
  --f-logo:"Bagel Fat One","IBM Plex Sans KR",system-ui,sans-serif;
  --f-display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-pixel:"Silkscreen",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e7eaff; --bg-dot:#d6daf8; --panel:#ffffff; --panel-2:#f0f1ff; --line:#c0c5ec; --depth:#a9afdf;
    --ink:#1b1d3d; --muted:#525889; --faint:#8a8fbe; --outline:#1b1d3d;
    --gold:#f5b400; --gold-deep:#a87800; --gold-ink:#2b1d00;
    --accent:#e4532f; --accent-deep:#a3361b; --accent-ink:#ffffff;
    --good:#13a36b; --warn:#cf8500; --bad:#e0354f; --bad-ink:#ffffff;
    --c-body:#e04848; --c-mind:#2a78dc; --c-heart:#8a5cf0; --on-stat:#ffffff;
    --habit:#0f9a7f; --habit-ink:#0b7563;
    --r-c:#6d73a3; --r-r:#1f86d1; --r-e:#8a3fe0;
    --wk-band:rgba(30,36,92,.80); --wk-band-hi:rgba(30,36,92,.92);
    --scrim:rgba(40,44,90,.5);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e7eaff; --bg-dot:#d6daf8; --panel:#ffffff; --panel-2:#f0f1ff; --line:#c0c5ec; --depth:#a9afdf;
  --ink:#1b1d3d; --muted:#525889; --faint:#8a8fbe; --outline:#1b1d3d;
  --gold:#f5b400; --gold-deep:#a87800; --gold-ink:#2b1d00;
  --accent:#e4532f; --accent-deep:#a3361b; --accent-ink:#ffffff;
  --good:#13a36b; --warn:#cf8500; --bad:#e0354f; --bad-ink:#ffffff;
  --c-body:#e04848; --c-mind:#2a78dc; --c-heart:#8a5cf0; --on-stat:#ffffff;
  --habit:#0f9a7f; --habit-ink:#0b7563;
  --r-c:#6d73a3; --r-r:#1f86d1; --r-e:#8a3fe0;
  --wk-band:rgba(30,36,92,.80); --wk-band-hi:rgba(30,36,92,.92);
  --scrim:rgba(40,44,90,.5);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.3px,transparent 1.6px);background-size:18px 18px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-weight:700;letter-spacing:-.01em;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:12px 72px}
.window{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--depth)}
.pix{font-family:var(--f-pixel);letter-spacing:.06em}
.pix-label{font-family:var(--f-pixel);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.note{font-size:12.5px;color:var(--muted)}
.note.bad{color:var(--bad);font-weight:700}
.ic{display:inline-block;width:16px;height:16px;flex:none;vertical-align:-3px}
.ic svg,.brand-mark svg{width:100%;height:100%;display:block}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding-block:6px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .sync{margin-left:4px}
.brand-mark{width:30px;height:30px;display:block;animation:bob 1.4s steps(2) infinite}
.brand h1{font-family:var(--f-logo);font-weight:400;font-size:30px;line-height:1;letter-spacing:.03em}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date{font-family:var(--f-pixel);font-size:12px;color:var(--muted);letter-spacing:.06em;margin-right:4px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--faint)}
.sync[data-state=saved]::before{background:var(--good)}
.sync[data-state=saving]::before,.sync[data-state=loading]::before{background:var(--warn);animation:blink .8s steps(2) infinite}
.sync[data-state=error]::before{background:var(--bad)}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);box-shadow:0 3px 0 var(--depth);cursor:pointer;color:var(--ink);padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
.icon-btn[aria-pressed=false]{color:var(--faint)}
.icon-btn.busy{animation:blink 1s ease-in-out infinite;cursor:progress}
@keyframes blink{50%{opacity:.45}}

/* layout */
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);grid-template-areas:"hud board" "extras board";grid-template-rows:auto 1fr;gap:20px 22px;align-items:start}
.hud{grid-area:hud}
.board{grid-area:board;min-width:0}
.extras{grid-area:extras;display:grid;gap:20px;min-width:0}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"hud" "board" "extras"}}

/* buttons & inputs */
.btn{--b:var(--panel-2);--bd:var(--line);--bc:var(--ink);--sh:var(--depth);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;padding:9px 14px;border-radius:var(--r);border:2px solid var(--bd);background:var(--b);color:var(--bc);box-shadow:0 3px 0 var(--sh);cursor:pointer;white-space:nowrap;transition:transform .06s,box-shadow .06s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--sh)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none;box-shadow:0 3px 0 var(--sh)}
.btn.primary{--b:var(--accent);--bd:var(--accent-deep);--bc:var(--accent-ink);--sh:var(--accent-deep)}
.btn.gold{--b:var(--gold);--bd:var(--gold-deep);--bc:var(--gold-ink);--sh:var(--gold-deep)}
.btn.danger{--b:var(--bad);--bd:var(--bad);--bc:var(--bad-ink);--sh:var(--depth)}
.btn.ghost{--b:transparent;--sh:transparent;box-shadow:none}
.btn.ghost:active{transform:translateY(1px)}
.btn.small{font-size:12.5px;padding:5px 10px;box-shadow:0 2px 0 var(--sh)}
.btn.ghost.small{box-shadow:none}
.btn.big{font-size:16px;padding:12px 22px}
.btn .ic{width:14px;height:14px;vertical-align:0}
.inp{font:inherit;color:var(--ink);background:var(--panel-2);border:2px solid var(--line);border-radius:var(--r);padding:9px 12px;min-width:0;width:100%}
.inp::placeholder{color:var(--faint)}
.inp:focus{outline:none;border-color:var(--gold)}
textarea.inp{resize:vertical;min-height:88px;line-height:1.55}
select.inp{padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.pill-btn{font:inherit;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.pill-btn.stat{border-color:var(--sc);color:var(--sc)}
.pill-btn:hover{filter:brightness(1.1)}
.x-btn{width:24px;height:24px;flex:none;padding:0;border:0;border-radius:4px;background:transparent;color:var(--faint);cursor:pointer;font-size:17px;line-height:1}
.x-btn:hover{color:var(--bad);background:var(--panel)}

/* HUD */
.hud{padding:18px;display:grid;gap:16px;box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 6px var(--panel-2),0 4px 0 var(--depth)}
.hero-top{display:flex;gap:16px;align-items:center}
.sprite-wrap{width:108px;height:116px;flex:none;position:relative;display:grid;place-items:end center;background:var(--panel-2);border:2px solid var(--line);border-radius:var(--r);overflow:hidden}
.sprite-wrap{background:radial-gradient(120% 90% at 50% 18%,color-mix(in srgb,var(--panel) 55%,var(--panel-2)) 0,var(--panel-2) 70%)}
.sprite-wrap::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-16px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--line) 55%,var(--panel-2))}
.sprite{position:relative;width:100px;height:100px;margin-bottom:6px;animation:bob 2.4s ease-in-out infinite}
.sprite svg{width:100%;height:100%;display:block}
.sprite-bg{position:absolute;inset:0;z-index:0;pointer-events:none}
.sprite-bg svg{width:100%;height:100%;display:block}
.sprite-wrap .sprite{z-index:1}
.sprite-wrap.has-bg::before{display:none}
.sprite-wrap .edit-badge{z-index:2}
.g-scene{position:relative;width:170px;height:150px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px var(--rc),0 4px 0 var(--depth);animation:heropop .6s cubic-bezier(.2,1.5,.4,1) both}
.g-scene>svg{position:absolute;inset:0;width:100%;height:100%}
.g-scene-hero{position:absolute;left:50%;bottom:2px;width:112px;height:112px;translate:-50% 0}
.g-scene-hero svg{width:100%;height:100%;display:block;animation:hop 1.2s .6s ease-in-out infinite}
.sprite.jump{animation:jump .55s cubic-bezier(.3,1.5,.5,1)}
.sprite-wrap.aura .sprite{filter:drop-shadow(0 0 6px var(--gold)) drop-shadow(0 0 2px var(--gold))}
.hero-id{min-width:0;display:grid;gap:2px}
.hero-name{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.hero-title{color:var(--ink);font-size:13.5px;font-weight:700}
.gear-hint{color:var(--muted);font-size:12px}
.lv{display:inline-flex;align-items:baseline;gap:6px;justify-self:start;margin-top:6px;background:var(--gold);color:var(--gold-ink);padding:3px 10px 4px;border-radius:4px;box-shadow:0 3px 0 var(--gold-deep)}
.lv-label{font-family:var(--f-pixel);font-size:12px;font-weight:700}
.lv-num{display:inline-block;font-family:var(--f-pixel);font-size:21px;font-weight:700;line-height:1}
.lv-num.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-pixel);font-size:12px;font-variant-numeric:tabular-nums}
.bar{height:18px;margin-top:5px;background:var(--depth);border:2px solid var(--line);border-radius:4px;overflow:hidden;position:relative;display:flex}
.xp-fill{height:100%;width:0;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,var(--gold-deep) 10px 12px);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xp-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shine 3s ease-in-out infinite}
.bar.glow{animation:barGlow .6s}
.sta-done{height:100%;background:var(--good);transition:width .5s}
.sta-plan{height:100%;background:repeating-linear-gradient(90deg,var(--good) 0 6px,transparent 6px 9px);opacity:.55;transition:width .5s}
.bar.over .sta-done,.bar.over .sta-plan{background-color:transparent}
.bar.over .sta-plan{background:repeating-linear-gradient(90deg,var(--bad) 0 6px,transparent 6px 9px);opacity:.85}
.sta-note{font-size:12.5px;color:var(--muted);margin-top:6px}
.sta-note.bad{color:var(--bad);font-weight:700}
.hud-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hstat{background:var(--panel-2);border-radius:var(--r);padding:8px 6px;display:grid;justify-items:center;gap:1px;text-align:center}
.hstat b{font-family:var(--f-pixel);font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums}
.hstat small{font-size:11.5px;color:var(--muted)}
.hstat .ic{width:18px;height:18px}
.flame-ic{animation:flick .5s steps(2) infinite;transform-origin:50% 100%}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px 8px;background:var(--panel);color:var(--muted);border:2px solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--depth);cursor:pointer;transition:transform .12s}
.tab .tab-k{font-family:var(--f-pixel);font-size:10px;letter-spacing:.1em}
.tab .tab-n{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.2;color:var(--ink)}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent-deep);box-shadow:0 4px 0 var(--accent-deep);color:var(--accent-ink);transform:translateY(-2px)}
.tab[aria-selected=true] .tab-n{color:var(--accent-ink)}
.badge{position:absolute;top:-8px;right:-6px;min-width:22px;height:22px;padding:0 5px;display:grid;place-items:center;font-family:var(--f-pixel);font-size:11px;font-weight:700;background:var(--gold);color:var(--gold-ink);border:2px solid var(--gold-deep);border-radius:5px}
.badge:empty{display:none}
#panel.swap{animation:swap .3s ease-out}

/* quick add form */
.add{padding:14px;display:grid;gap:10px;margin-bottom:6px}
.add-row{display:flex;gap:8px}
.add-row .inp{flex:1}
.chip-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:2px solid var(--line);border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);background:var(--panel-2);transition:background .12s,color .12s}
.chip span i{font-style:normal;font-family:var(--f-pixel);font-size:10px;opacity:.85}
.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.chip-label{font-size:12px;color:var(--muted);font-weight:700}
.auto-hint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.add .date-inp{width:auto;padding:6px 10px}

/* briefing */
.brief{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:14px 16px;margin-bottom:12px}
.brief-text{font-size:15px;margin-top:2px}
.brief-text b{font-weight:700}
.gold-t{color:var(--gold-deep)}
.brief-sub{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
:root:not([data-theme="light"]) .gold-t{color:var(--gold)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .gold-t{color:var(--gold-deep)}}

/* sections & quest cards */
.sec{display:grid;gap:10px;margin-top:22px}
.sec.pool{padding:12px 14px 14px;border:1.5px dashed var(--line);border-radius:var(--r);background:color-mix(in srgb,var(--panel-2) 55%,transparent)}
.sec.pool .note{margin:0}
.day-group{margin-top:18px}
.day-group>summary{list-style:none;cursor:pointer;border-radius:4px;margin:0 -6px;padding:4px 6px}
.day-group>summary::-webkit-details-marker{display:none}
.day-group>summary:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.day-group .caret{margin-right:6px;color:var(--muted)}
.day-group[open] .caret{transform:rotate(90deg)}
.day-group:not([open]){gap:0}
.day-group .sec-head h2{font-size:16px}
.day-group .sec-head h2 small,.wk-grp>summary small{font-family:var(--f-pixel);font-size:11px;font-weight:400;color:var(--faint);margin-left:6px}
.day-group.is-today .sec-head h2::after{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--gold);margin-left:7px;vertical-align:2px}
.count.over{color:var(--warn);font-weight:700}
.day-empty{margin:0;padding:9px 12px;border:1.5px dashed var(--line);border-radius:var(--r)}
.sec.pulse{animation:secpulse 1s ease-out}
@keyframes secpulse{0%,100%{background:transparent}30%{background:color-mix(in srgb,var(--gold) 14%,transparent)}}
.wk-grp{border:1.5px solid var(--line);border-radius:var(--r);padding:2px 8px 4px;background:color-mix(in srgb,var(--panel) 60%,transparent)}
.wk-grp+.wk-grp{margin-top:8px}
.wk-grp>summary{padding:8px 4px}
.wk-grp .note{margin:2px 4px 8px}
.dblock{padding:0 0 6px;border-radius:4px}
.dblock+.dblock{border-top:1px dashed color-mix(in srgb,var(--line) 70%,transparent)}
.dblock-h{display:flex;align-items:baseline;gap:6px;padding:7px 4px 5px;font-size:13px}
.dblock-h b{font-weight:700}
.dblock.is-today .dblock-h b{color:var(--accent)}
.dblock-h small{font-family:var(--f-pixel);font-size:10px;color:var(--faint)}
.dblock-h .count{margin-left:auto;font-size:11.5px}
.dblock-empty{margin:0 2px;padding:6px 10px;border:1.5px dashed var(--line);border-radius:var(--r);font-size:12px;color:var(--faint)}
body.is-dragging .dblock-empty{border-color:var(--muted)}
.wk-grp .quests{margin:0 0 2px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-head h2{font-family:var(--f-display);font-size:19px}
.count{font-family:var(--f-pixel);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.quests{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.quest{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px 12px;padding:10px 8px 10px 12px;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);box-shadow:0 3px 0 var(--depth)}
.quest.boss:not(.done){border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.check{position:relative;width:26px;height:26px;padding:0;display:grid;place-items:center;border:2.5px solid var(--sc);border-radius:4px;background:var(--panel-2);color:var(--on-stat);cursor:pointer;box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--sc) 25%,transparent);transition:transform .08s}
.check:hover{transform:scale(1.06)}
.check:active{transform:scale(.92)}
.check::after{content:"";position:absolute;inset:-7px}
.check svg{width:15px;height:15px;opacity:0;transform:scale(.3);transition:opacity .15s,transform .3s cubic-bezier(.3,1.8,.5,1)}
.quest.done .check{background:var(--sc);box-shadow:none}
.quest.done .check svg{opacity:1;transform:none}
.quest.done{background:color-mix(in srgb,var(--panel) 55%,var(--bg));box-shadow:none}
.quest.done .q-title{text-decoration:line-through;text-decoration-thickness:2px;color:var(--faint)}
.q-body{min-width:0}
.q-title{font-weight:500;overflow-wrap:anywhere}
.q-meta{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;margin-top:3px;font-size:12px;color:var(--muted)}
.stat-tag{display:inline-flex;align-items:center;gap:4px;font-weight:500}
.stat-tag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sc)}
button.stat-tag{border:0;background:none;padding:0;font:inherit;font-weight:700;color:inherit;cursor:pointer;border-bottom:1px dashed var(--line)}
button.stat-tag:hover{color:var(--ink);border-bottom-color:currentColor}
.pips{display:inline-flex;gap:2px}
.pips b{width:7px;height:7px;background:var(--line)}
.pips b.on{background:var(--gold)}
.sta-tag{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-pixel);font-size:11px}
.sta-tag .ic{width:11px;height:11px;vertical-align:0}
.tag{font-size:11px;line-height:1.45;padding:0 6px;border-radius:4px;border:1.5px solid var(--line);color:var(--muted);font-weight:500;white-space:nowrap;max-width:14em;overflow:hidden;text-overflow:ellipsis}
.tag.boss{background:var(--bad);border-color:var(--bad);color:var(--bad-ink);font-family:var(--f-pixel);font-size:10px;font-weight:700;letter-spacing:.05em}
.tag.warn{border-color:var(--warn);color:var(--warn);font-weight:700}
.tag.habit{border-color:var(--habit);color:var(--habit-ink);background:color-mix(in srgb,var(--habit) 14%,transparent);font-weight:700}
.quest.habit{border-color:color-mix(in srgb,var(--habit) 50%,var(--line));background:color-mix(in srgb,var(--habit) 8%,var(--panel))}
.quest.habit::before{content:"";position:absolute;left:-2px;top:9px;bottom:9px;width:4px;border-radius:0 3px 3px 0;background:var(--habit)}
.quest.habit.done{background:color-mix(in srgb,var(--habit) 5%,color-mix(in srgb,var(--panel) 55%,var(--bg)))}
.h-habit::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--habit);margin-right:7px;vertical-align:1px}
.habit-strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding:8px 10px;border:1.5px dashed color-mix(in srgb,var(--habit) 55%,var(--line));border-radius:var(--r);background:color-mix(in srgb,var(--habit) 8%,var(--panel))}
.hs-label{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--habit-ink);margin-right:2px}
.hs-label .ic{width:13px;height:13px}
.hs-chip{display:inline-flex;align-items:center;gap:3px;max-width:14em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--panel);border:1.5px solid color-mix(in srgb,var(--habit) 40%,var(--line));color:var(--ink)}
.hs-chip.on{background:var(--habit);border-color:var(--habit);color:var(--on-stat);font-weight:700}
.hs-chip.later{border-style:dashed;background:transparent;color:var(--muted)}
button.hs-chip{font:inherit;font-size:12px;cursor:pointer;padding:2px 9px 2px 5px;transition:transform .08s}
button.hs-chip:hover{transform:translateY(-1px);border-color:var(--habit)}
button.hs-chip:active{transform:scale(.95)}
.hs-box{display:grid;place-items:center;width:14px;height:14px;flex:none;border:2px solid var(--habit);border-radius:3px;background:var(--panel)}
.hs-box svg{width:10px;height:10px;opacity:0}
.hs-chip.on .hs-box{border-color:var(--on-stat);background:transparent}
.hs-chip.on .hs-box svg{opacity:1;color:var(--on-stat)}
.hs-hint{font-size:11.5px;color:var(--faint);margin-left:auto}
.tag.scope{background:var(--panel-2)}
.streak{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:var(--accent)}
.streak .ic{width:12px;height:12px;vertical-align:0}
.xp-pill small{display:block;font-size:8.5px;font-weight:400;line-height:1.1;opacity:.85;margin-top:1px}
.xp-pill{text-align:center;font-family:var(--f-pixel);font-size:12px;font-weight:700;color:var(--gold-ink);background:var(--gold);padding:3px 7px;border-radius:4px;box-shadow:0 2px 0 var(--gold-deep);white-space:nowrap;font-variant-numeric:tabular-nums}
.quest.done .xp-pill{background:transparent;color:var(--faint);box-shadow:none;outline:1.5px dashed var(--line)}
.more{width:30px;height:30px;display:grid;place-items:center;padding:0;border:0;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer}
.more:hover,.more[aria-expanded=true]{background:var(--panel-2);color:var(--ink)}
.more svg{width:14px;height:4px}
.q-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:8px;border-top:1.5px dashed var(--line)}
.q-actions .inp{width:auto;padding:3px 8px;font-size:12.5px}
.edit-input{width:100%;padding:5px 9px;font-weight:500}
.plan{position:relative;display:inline-flex}
.plan select{font:inherit;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel-2);border:1.5px solid var(--line);border-radius:999px;padding:1px 22px 1px 9px;appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.plan.set select{color:var(--accent);border-color:var(--accent)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:16px 18px;color:var(--muted);display:grid;gap:4px;font-size:14px}
.empty b{color:var(--ink);font-weight:700}
.loading{color:var(--muted);padding:24px 4px}
.quest.enter{animation:enter .5s cubic-bezier(.2,1.4,.4,1)}
.quest.flash{animation:flash 1.1s ease-out}
.quest.just-done::after{content:"CLEAR!";position:absolute;right:58px;top:50%;font-family:var(--f-pixel);font-weight:700;font-size:13px;color:var(--sc);background:var(--panel);border:2px solid var(--sc);padding:0 6px;border-radius:4px;pointer-events:none;animation:stamp 1.4s ease-out forwards}
.quest.just-done .xp-pill{animation:pop .5s}

/* week planner */
.week{padding:14px;margin-bottom:12px;display:grid;gap:12px}
.week-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.h-sm{font-family:var(--f-display);font-size:20px;line-height:1.2}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;background:var(--panel-2);border:2px solid transparent;border-radius:var(--r);cursor:pointer;min-width:0}
.day:hover{border-color:var(--line)}
.day[aria-current=date]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--panel-2))}
.day.is-past{opacity:.62}
.day-name{font-weight:700;font-size:13px;line-height:1.2}
.day.is-today .day-name{color:var(--accent)}
.day-date{font-family:var(--f-pixel);font-size:10px;color:var(--muted)}
.day-bar{width:18px;height:66px;background:var(--panel);border:2px solid var(--line);border-radius:3px;display:flex;flex-direction:column-reverse;overflow:hidden}
.day-bar i{display:block;width:100%;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.day-bar .d{background:var(--good)}
.day-bar .p{background:repeating-linear-gradient(0deg,var(--good) 0 5px,transparent 5px 7px);opacity:.6}
.day.over .day-bar .p{background:repeating-linear-gradient(0deg,var(--bad) 0 5px,transparent 5px 7px);opacity:.9}
.day-meta{font-size:11px;color:var(--muted);white-space:nowrap}
.day.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}

/* month calendar */
.month{padding:14px 14px 16px;margin-bottom:12px;display:grid;gap:12px}
.month-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.month-stats{display:flex;gap:16px;flex-wrap:wrap}
.month-stats div{display:grid}
.month-stats b{font-family:var(--f-pixel);font-size:17px;font-variant-numeric:tabular-nums}
.month-stats small{font-size:11.5px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.cell{height:clamp(40px,8vw,58px);max-width:100%;border-radius:4px;background:var(--panel-2);display:flex;flex-direction:column;justify-content:space-between;padding:3px 5px;font-family:var(--f-pixel);font-size:10px;color:var(--muted);min-width:0}
.cell.l1{background:color-mix(in srgb,var(--gold) 24%,var(--panel-2))}
.cell.l2{background:color-mix(in srgb,var(--gold) 48%,var(--panel-2));color:var(--ink)}
.cell.l3{background:color-mix(in srgb,var(--gold) 74%,var(--panel-2));color:var(--gold-ink)}
.cell.l4{background:var(--gold);color:var(--gold-ink)}
.cell.out{visibility:hidden}
.cell.today{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.cell .pd{display:flex;gap:2px;flex-wrap:wrap}
.cell .pd i{width:4px;height:4px;background:var(--c-mind)}
.legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend .lg-ev{width:16px;height:9px;border-radius:2px;background:color-mix(in srgb,var(--c-mind) 15%,var(--panel));border-left:2px solid var(--c-mind)}
.legend .lg-wk{width:16px;height:9px;border-radius:2px;background:var(--wk-band)}
.legend .lg-gap{width:8px}
/* Calendar: chunky HUD tiles like the week strip, with quests as little pixel badges on top. */
.cal2{display:grid;gap:4px}
.cal-dows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dows span{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.cal-dows span:nth-child(6){color:var(--c-mind)}
.cal-dows span:nth-child(7){color:var(--accent)}
.cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:24px repeat(3,20px) 17px;column-gap:4px;row-gap:3px}
.cal-cell{grid-row:1 / -1;min-width:0;display:flex;justify-content:space-between;align-items:flex-start;gap:2px;padding:4px 4px 0;border:2px solid transparent;border-radius:5px;background:var(--panel-2);box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--depth) 30%,transparent);font:inherit;color:var(--ink);text-align:left;cursor:pointer;transition:border-color .12s}
.cal-cell:hover{border-color:var(--line)}
.cal-cell.l1{background:color-mix(in srgb,var(--gold) 14%,var(--panel-2))}
.cal-cell.l2{background:color-mix(in srgb,var(--gold) 26%,var(--panel-2))}
.cal-cell.l3{background:color-mix(in srgb,var(--gold) 40%,var(--panel-2))}
.cal-cell.l4{background:color-mix(in srgb,var(--gold) 56%,var(--panel-2))}
.cal-cell.out{opacity:.4}
.cal-cell.past:not(.l1):not(.l2):not(.l3):not(.l4){background:color-mix(in srgb,var(--panel-2) 70%,var(--panel))}
.cal-cell.today{border-color:var(--accent)}
.cal-cell.sel{border-color:var(--gold);box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--gold) 45%,transparent),0 0 0 2px color-mix(in srgb,var(--gold) 30%,transparent)}
.cal-n{font-family:var(--f-pixel);font-size:11px;font-weight:700;line-height:16px;min-width:18px;padding:0 3px;border-radius:3px;text-align:center}
.cal-cell.sat .cal-n{color:var(--c-mind)}
.cal-cell.sun .cal-n{color:var(--accent)}
.cal-cell.past .cal-n{opacity:.7}
.cal-cell.today .cal-n{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 0 var(--accent-deep);opacity:1}
.cal-x{font-family:var(--f-pixel);font-size:9px;line-height:16px;color:var(--gold-deep);white-space:nowrap}
.cal-ev{position:relative;z-index:1;min-width:0;height:18px;margin:0 4px;padding:0 6px 0 7px;display:flex;align-items:center;border-radius:4px;background:color-mix(in srgb,var(--sc) 15%,var(--panel));color:color-mix(in srgb,var(--sc) 30%,var(--ink));font-size:11px;font-weight:600;letter-spacing:-.01em;line-height:1;cursor:pointer;overflow:hidden;transition:background .12s}
.cal-ev::before{content:"";position:absolute;left:2px;top:3px;bottom:3px;width:2px;border-radius:2px;background:var(--sc)}
.cal-ev span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-ev:hover{background:color-mix(in srgb,var(--sc) 26%,var(--panel))}
.cal-ev.cl::before{display:none}
.cal-ev.cl{margin-left:0;padding-left:6px;border-top-left-radius:0;border-bottom-left-radius:0}
.cal-ev.cr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.cal-ev.k-week::before{display:none}
.cal-ev.k-week{background:var(--wk-band);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 6px rgba(20,22,60,.18);color:#fff;font-weight:600;letter-spacing:0;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.cal-ev.k-week span{text-shadow:0 1px 1px rgba(10,12,40,.35)}
.cal-ev.k-week:hover{background:var(--wk-band-hi)}
.cal-ev.k-week.done{background:color-mix(in srgb,var(--wk-band) 45%,transparent);color:rgba(255,255,255,.75);box-shadow:none}
.cal-ev.k-sum{--sc:var(--muted)}
.cal-ev.k-late{--sc:var(--warn)}
.cal-ev.done{background:transparent;color:var(--faint);font-weight:500}
.cal-ev.done::before{background:color-mix(in srgb,var(--sc) 40%,transparent)}
.cal-ev.done span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--faint) 70%,transparent)}
.cal-more{grid-row:5;z-index:1;justify-self:start;align-self:center;min-width:0;margin:0 4px;padding:0 3px;border:0;border-radius:3px;background:none;font:inherit;font-size:10.5px;font-weight:600;line-height:15px;color:var(--muted);cursor:pointer;white-space:nowrap}
.cal-more:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
body.is-dragging .cal-ev,body.is-dragging .cal-more{pointer-events:none}
.cal-pick{margin-top:0}
.cal-pick .sec-head .row{display:flex;align-items:center;gap:8px}
.tag.span{border-color:var(--c-mind);color:var(--c-mind);font-weight:700}
@media (max-width:620px){
  .cal2,.cal-dows{gap:3px}
  .cal-row{grid-template-rows:21px repeat(3,6px) 15px;column-gap:3px;row-gap:3px}
  .cal-cell{padding:3px 2px 0}
  .cal-ev{height:5px;margin:0 3px;padding:0;border-radius:3px;box-shadow:none;background:color-mix(in srgb,var(--sc) 75%,var(--panel))}
  .cal-ev::before,.cal-ev span{display:none}
  .cal-ev.k-week{background:var(--wk-band);box-shadow:none}
  .cal-ev.done{background:color-mix(in srgb,var(--sc) 25%,transparent)}
  .cal-x{display:none}
  .cal-more{margin:0 2px;padding:0 2px;font-size:9px;line-height:13px}
}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* month rail (shared by epics and the planner preview) */
.rail-wrap{overflow-x:auto;padding:2px 2px 8px;min-width:0}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(128px,1fr);gap:6px}
.mo{background:var(--panel-2);border:2px solid transparent;border-radius:var(--r);padding:8px;display:grid;gap:5px;align-content:start;min-height:64px}
.mo.now{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel-2))}
.mo.past{opacity:.6}
.mo-label{display:flex;justify-content:space-between;gap:4px;font-family:var(--f-pixel);font-size:11px;color:var(--muted)}
.mo.now .mo-label{color:var(--accent)}
.ms{display:flex;gap:5px;align-items:baseline;font-size:12px;line-height:1.35;padding:4px 6px;border-radius:4px;background:var(--panel);overflow-wrap:anywhere;min-width:0}
.ms::before{content:"";flex:none;width:6px;height:6px;border-radius:2px;background:var(--sc);transform:translateY(-1px)}
.ms span{flex:1;min-width:0}
.ms.done{color:var(--faint);text-decoration:line-through}
.ms .x-btn{width:18px;height:18px;font-size:14px;align-self:center}

/* epics */
.epics{display:grid;gap:16px;margin-top:22px}
.epic{padding:16px;display:grid;gap:12px}
.epic>*{min-width:0}
.epic.enter{animation:enter .5s cubic-bezier(.2,1.4,.4,1)}
.epic-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}
.epic-ic{width:34px;height:34px;display:block;margin-top:2px}
.epic-ic svg{width:100%;height:100%;display:block}
.epic h3{font-family:var(--f-display);font-size:21px;line-height:1.25;overflow-wrap:anywhere}
.dday{font-family:var(--f-pixel);font-size:11px;font-weight:700;padding:0 6px;border-radius:4px;background:var(--panel-2);color:var(--ink)}
.dday.warn{background:var(--warn);color:var(--gold-ink)}
.dday.bad{background:var(--bad);color:var(--bad-ink)}
.epic-prog{display:grid;gap:6px}
.segbar{display:flex;gap:3px}
.segbar i{flex:1;height:14px;background:var(--panel-2);border:2px solid var(--line);border-radius:2px;transition:background .3s}
.segbar i.on{background:var(--sc);border-color:var(--sc)}
.epic-prog-txt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.groups{display:grid;gap:4px}
.grp>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 6px;border-radius:4px;font-weight:700;font-size:13.5px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary:hover{background:var(--panel-2)}
.caret{display:inline-block;width:0;height:0;margin-right:8px;border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .2s;vertical-align:1px}
.grp[open] .caret{transform:rotate(90deg)}
.grp .quests{margin:4px 0 8px}
.steps .quest{background:var(--panel-2);box-shadow:none;border-color:transparent}
.steps .quest.done{background:transparent;border-color:var(--panel-2)}
.step-add{display:flex;gap:8px;flex-wrap:wrap}
.step-add input.inp{flex:1 1 200px;width:auto}
.step-add select.inp,.step-add .step-date{flex:0 0 auto;width:auto}
.epic-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.clear-btn{animation:pulse 1.3s ease-in-out infinite}
.ai-box{background:var(--panel-2);border:2px dashed var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px;width:100%}
.ai-head{font-weight:700;font-size:14px}
.ai-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ai-list label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;cursor:pointer}
.ai-list input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.ai-think{display:flex;align-items:center;gap:4px;font-weight:500}
.think-dots i{display:inline-block;width:5px;height:5px;margin-left:3px;background:currentColor;animation:blink 1s steps(2) infinite}
.think-dots i:nth-child(2){animation-delay:.2s}
.think-dots i:nth-child(3){animation-delay:.4s}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fame{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fame-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 8px 10px 12px;background:color-mix(in srgb,var(--gold) 12%,var(--panel));border:2px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:var(--r)}
.fame-row .epic-ic{width:26px;height:26px;margin:0}
.fame-row b{display:block;font-weight:700;overflow-wrap:anywhere}
.fame-row small{color:var(--muted);font-size:12px}

/* extras */
.box{padding:16px;display:grid;gap:12px}
.box-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.box-head h3{font-family:var(--f-display);font-size:18px}
.stat-rows{display:grid;gap:14px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
.srow .nm{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:15px}
.srow .nm i{width:10px;height:10px;border-radius:2px;background:var(--sc)}
.srow .hint{font-size:12px;color:var(--muted);overflow-wrap:anywhere}

.pv-chip{display:flex;gap:4px;align-items:baseline;font-size:11.5px;line-height:1.3;padding:3px 6px;border-radius:4px;background:var(--panel-2);overflow-wrap:anywhere;min-width:0}
.pv-chip::before{content:"";flex:none;width:6px;height:6px;border-radius:2px;background:var(--sc);transform:translateY(-1px)}
.pv-items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pv-item{display:grid;gap:4px;padding:6px 6px 8px;background:var(--panel);border-radius:var(--r);min-width:0}
.t-inp{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:transparent;border:1.5px solid transparent;border-radius:4px;padding:3px 6px;width:100%;min-width:0}
.t-inp.big{font-size:17px;font-weight:700}
.t-inp:hover{border-color:var(--line)}
.t-inp:focus{outline:none;border-color:var(--gold);background:var(--panel-2)}
.wz-sec .t-inp:focus{background:var(--panel)}
.pv-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-left:6px;font-size:12px;color:var(--muted)}
.pv-meta .x-btn{margin-left:auto}
.day-sel{font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;max-width:12em}
.wz-sec .day-sel{background:var(--panel)}
.plan-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.ms-edit{display:grid;gap:6px;padding-top:6px}
.ms-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ms-row input[data-wz=mst]{flex:1 1 160px}
.date-chip{font:inherit;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel-2);border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;min-width:0;max-width:12em;cursor:pointer}
.date-chip:focus{outline:none;border-color:var(--gold)}
.date-chip.set,.plan.set .date-chip{color:var(--accent);border-color:var(--accent)}
.wz-sec .date-chip,.ms-row .date-chip{background:var(--panel)}
.dow-tag{font-size:11.5px;font-weight:700;color:var(--muted)}
.ms b{font-family:var(--f-pixel);font-size:10.5px;color:var(--accent);margin-right:2px}
.ms-row .pv-check{margin-top:0}
.ms-row.done input{text-decoration:line-through;color:var(--faint)}
.pv-item{grid-template-columns:auto minmax(0,1fr);align-items:start;gap:4px 8px;padding:6px 6px 8px 8px}
.pv-main{display:grid;gap:4px;min-width:0}
.pv-check{width:26px;height:26px;margin-top:3px;padding:0;display:grid;place-items:center;border:2.5px solid var(--sc);border-radius:4px;background:var(--panel-2);color:var(--on-stat);cursor:pointer;transition:transform .08s}
.pv-check:hover{transform:scale(1.06)}
.pv-check svg{width:14px;height:14px;opacity:0}
.done>.pv-check{background:var(--sc)}
.done>.pv-check svg{opacity:1}
.pv-item.done .t-inp{text-decoration:line-through;color:var(--faint)}
.tag.clear{border-color:var(--gold);color:var(--gold-deep);font-weight:700}
.pv-chip.done{text-decoration:line-through;color:var(--faint)}
.pv-chip.fixed{opacity:.6}
button.sprite-wrap{padding:0;font:inherit;color:inherit;cursor:pointer;transition:transform .12s,border-color .12s}
button.sprite-wrap:hover{border-color:var(--gold)}
button.sprite-wrap:active{transform:scale(.97)}
.edit-badge{position:absolute;top:4px;right:4px;z-index:2;font-size:10px;font-weight:700;line-height:1.5;padding:0 5px;border-radius:4px;background:var(--panel);color:var(--muted);border:1px solid var(--line);opacity:0;transition:opacity .15s}
button.sprite-wrap:hover .edit-badge,button.sprite-wrap:focus-visible .edit-badge{opacity:1}
@media (hover:none){.edit-badge{opacity:1}}
.look-top{display:flex;gap:14px;align-items:center}
.look-preview{width:120px;height:120px;flex:none;background:var(--panel-2);border:2px solid var(--line);border-radius:var(--r);display:grid;place-items:center}
.look-preview{position:relative;overflow:hidden}
.look-preview>svg{position:relative;width:104px;height:104px;display:block;animation:hop 1s ease-in-out infinite}
.look-preview.aura>svg{filter:drop-shadow(0 0 6px var(--gold)) drop-shadow(0 0 2px var(--gold))}
.look-sec{display:grid;gap:6px}
.look-sec h3{font-size:13px;font-weight:700}
.look-opts{display:flex;flex-wrap:wrap;gap:6px}
.look-opt{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer}
.look-opt:hover{border-color:var(--muted)}
.look-opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.look-opt.locked{opacity:.45;cursor:not-allowed}
.look-opt i{font-style:normal;font-family:var(--f-pixel);font-size:10px;color:var(--muted)}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--outline);display:inline-block;flex:none}
.goals{display:grid;gap:8px}
.goal-card{display:grid;gap:6px;padding:10px 12px;background:var(--panel-2);border-radius:var(--r);border:1.5px solid color-mix(in srgb,var(--gold) 40%,var(--line))}
.goal-head{display:flex;align-items:center;gap:8px}
.goal-head .epic-ic{width:24px;height:24px;margin:0;flex:none}
.goal-card .t-inp:focus{background:var(--panel)}
.grow{flex:1}
.goal-tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--gold) 18%,transparent);padding:0 7px;border-radius:4px;max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-tag .ic{width:11px;height:11px;vertical-align:0;flex:none}
.ag{display:grid;gap:6px}
.ag-label{font-family:var(--f-pixel);font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.ag-sec{display:grid;gap:6px;padding:8px 10px 10px;background:var(--panel-2);border-radius:var(--r);border:1.5px solid transparent}
.ag-sec.empty{padding:6px 10px}
.ag-sec.empty .ag-head h4{color:var(--muted);font-weight:500}
.ag-sec.over{border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.ag-sec.done-sec{opacity:.85}
.ag-head{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.ag-head h4{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:700}
.ag-head h4 small{font-size:11.5px;font-weight:500;color:var(--muted)}
.ag-load{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-pixel);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ag-load .lb{display:block;width:64px;height:6px;border-radius:3px;background:var(--panel);overflow:hidden}
.ag-load .lb i{display:block;height:100%;background:var(--good)}
.ag-sec.over .ag-load{color:var(--bad)}
.ag-sec.over .lb i{background:var(--bad)}
.ag .pv-item{grid-template-columns:auto auto minmax(0,1fr);gap:4px 8px;padding:6px 6px 8px 4px}
.grip{width:10px;align-self:stretch;min-height:26px;margin-top:2px;border-radius:3px;background-image:radial-gradient(var(--faint) 1.2px,transparent 1.4px);background-size:5px 5px;opacity:.8;cursor:grab}
.pv-item[data-drag]:hover .grip{opacity:1;background-image:radial-gradient(var(--ink) 1.2px,transparent 1.4px)}
.when-chip{font:inherit;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;white-space:nowrap}
.when-chip::after{content:"";border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.55}
.when-chip:hover{border-color:var(--muted)}
.when-chip.broad,.when-chip.auto{border-style:dashed;color:var(--muted)}
.when-chip.none{border-style:dashed;color:var(--faint)}
.wz-sec .when-chip,.ms-row .when-chip{background:var(--panel)}
.when-pop{position:fixed;z-index:75;width:min(300px,calc(100vw - 16px));padding:12px;display:grid;gap:10px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.wp-sec{display:grid;gap:6px}
.wp-h{font-size:11.5px;font-weight:700;color:var(--muted)}
.wp-opts{display:flex;flex-wrap:wrap;gap:5px}
.wp-opts .pill-btn{padding:3px 10px}
.wp-opts .pill-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wp-foot{padding-top:8px;border-top:1.5px dashed var(--line)}
.when-pop .inp{padding:6px 10px}
[data-drag]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.pv-chip[data-drag]{border:1.5px dashed transparent}
.pv-chip[data-drag]:hover{border-color:var(--sc)}
.dragging{opacity:.35}
.ins-line{position:fixed;z-index:79;height:3px;border-radius:2px;background:var(--gold);pointer-events:none}
.ins-line::before{content:"";position:absolute;left:-5px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.drag-ghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;max-width:240px;padding:6px 10px;border-radius:var(--r);background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 20px rgba(0,0,0,.35)}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
body.is-dragging [data-drop]{outline:2px dashed var(--line);outline-offset:-2px}
body.is-dragging [data-drop].drop-over{outline:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 20%,var(--panel-2))}
.ms-row select,.ms-row input{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:4px;padding:3px 6px;min-width:0}
.ms-row input:focus,.ms-row select:focus{outline:none;border-color:var(--gold)}
.src-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.src{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px 8px 10px;background:var(--panel);border-radius:var(--r)}
.src input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.src label{display:grid;cursor:pointer;min-width:0}
.src b{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.src small{font-size:11.5px;color:var(--muted)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.file-btn:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.paste-box{display:grid;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:var(--r)}
@media (max-width:620px){
  .scope-grid{grid-template-columns:minmax(0,1fr)}
  .pv-week{grid-template-columns:minmax(0,1fr)}
  .pv-day{grid-template-columns:5.5em minmax(0,1fr);align-items:start}
  .pv-day h4{grid-row:span 9;flex-direction:column;gap:0}
}

.toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:70;display:grid;gap:8px;justify-items:center;width:min(92vw,460px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:500;font-size:14px;box-shadow:0 4px 0 var(--depth);text-align:center;animation:toastIn .35s cubic-bezier(.2,1.4,.4,1);transition:opacity .3s,transform .3s}
.toast.gold{background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:15px;box-shadow:0 4px 0 var(--gold-deep)}
.toast.gold .pix{display:block;font-size:18px;font-weight:700}
.toast.out{opacity:0;transform:translateY(10px)}
.float-txt{position:fixed;z-index:65;pointer-events:none;font-family:var(--f-pixel);font-weight:700;font-size:16px;color:var(--gold);white-space:nowrap;text-shadow:2px 2px 0 var(--outline),-1px -1px 0 var(--outline),1px -1px 0 var(--outline),-1px 1px 0 var(--outline);animation:floatUp 1.25s cubic-bezier(.2,.8,.3,1) forwards}
.float-txt.coin{color:var(--warn);font-size:13px}
.app.shake{animation:shake .45s}

@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes jump{0%{transform:none}35%{transform:translateY(-24px)}62%{transform:translateY(0) scale(1.08,.88)}100%{transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
@keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}
@keyframes barGlow{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 55%,transparent),0 0 18px var(--gold)}}
@keyframes flick{50%{transform:scale(1.1,.9)}}
@keyframes blink{50%{opacity:.2}}
@keyframes swap{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes enter{0%{opacity:0;transform:translateY(-12px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes flash{0%,100%{box-shadow:0 3px 0 var(--depth)}25%{box-shadow:0 0 0 3px var(--gold),0 3px 0 var(--depth)}}
@keyframes stamp{0%{opacity:0;transform:translateY(-50%) rotate(-10deg) scale(2.4)}14%{opacity:1;transform:translateY(-50%) rotate(-10deg) scale(1)}75%{opacity:1;transform:translateY(-50%) rotate(-10deg) scale(1)}100%{opacity:0;transform:translateY(-60%) rotate(-10deg) scale(1)}}
@keyframes bump{40%{transform:translateY(-6px)}}
@keyframes pulse{50%{transform:scale(1.04);filter:brightness(1.12)}}
@keyframes spin{to{rotate:360deg}}
@keyframes cardIn{0%{opacity:0;transform:scale(.6) translateY(24px)}100%{opacity:1;transform:none}}
@keyframes letter{0%{opacity:0;transform:translateY(-70px) scale(.4)}100%{opacity:1;transform:none}}
@keyframes hop{50%{transform:translateY(-10px)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}100%{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}14%{opacity:1;transform:translate(-50%,-6px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}

@media (max-width:520px){
  .brand h1{font-size:25px}
  .date{display:none}
  .topbar{gap:8px 10px}
  .brand{gap:8px}
  .brand h1{font-size:26px}
  .brand .sync{font-size:11px;padding:2px 8px;margin-left:2px}
  .top-right{gap:6px}
  .top-right .icon-btn{width:34px;height:34px}
  .top-right .icon-btn svg{width:18px;height:18px}
  .quest{gap:6px 10px;padding-left:10px}
  .quest.just-done::after{right:46px}
  .tab .tab-n{font-size:15px}
  .hero-name{font-size:20px}
  .modal{padding:18px}
  .wz-foot{bottom:-18px;margin-bottom:-18px;padding-bottom:30px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .rays{display:none}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" id="brandMark" aria-hidden="true"></span><h1>QUESTLINE</h1><span class="sync" id="sync" data-state="loading">불러오는 중</span></div>
    <div class="top-right">
      <span class="date" id="dateLabel"></span>
      <button class="btn primary small" id="planBtn" type="button" data-action="plan-wizard">계획 세우기</button>
      <button class="icon-btn" id="gcalBtn" type="button" data-action="gcal-sync" aria-label="구글 캘린더로 보내기" title="구글 캘린더로 보내기" hidden></button>
      <button class="icon-btn" id="helpBtn" type="button" data-action="help" aria-label="게임 규칙" title="게임 규칙"></button>
      <button class="icon-btn" id="soundBtn" type="button" data-action="sound" aria-pressed="true" aria-label="효과음"></button>
      <button class="icon-btn" id="settingsBtn" type="button" data-action="settings" aria-label="설정"></button>
    </div>
  </header>

  <div class="layout">
    <section class="hud window" aria-label="캐릭터 상태">
      <div class="hero-top">
        <button class="sprite-wrap" id="spriteWrap" type="button" data-action="look-open" title="캐릭터 꾸미기" aria-label="캐릭터 꾸미기"><div class="sprite-bg" id="spriteBg"></div><div class="sprite" id="sprite"></div><span class="edit-badge" aria-hidden="true">꾸미기</span></button>
        <div class="hero-id">
          <div class="hero-name" id="heroName">모험가</div>
          <div class="hero-title" id="heroTitle">견습 모험가</div>
          <div class="gear-hint" id="gearHint"></div>
          <div class="lv"><span class="lv-label">LV</span><span class="lv-num" id="lvNum">1</span></div>
        </div>
      </div>
      <div>
        <div class="meter-row"><span class="pix-label">EXP</span><span id="xpText">0 / 100</span></div>
        <div class="bar" id="xpBar" role="progressbar" aria-label="경험치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="xp-fill" id="xpFill"></div></div>
      </div>
      <div class="hud-stats">
        <div class="hstat"><span class="ic" id="icGold"></span><b id="goldNum">0</b><small>골드</small></div>
        <div class="hstat"><span class="ic flame-ic" id="icFlame"></span><b id="streakNum">0</b><small>연속 일수</small></div>
        <div class="hstat"><span class="ic" id="icStar"></span><b id="totalNum">0</b><small>총 EXP</small></div>
      </div>
      <div>
        <div class="meter-row"><span class="pix-label">Stamina</span><span id="staText">0 / 100</span></div>
        <div class="bar" id="staBar"><div class="sta-done" id="staDone"></div><div class="sta-plan" id="staPlan"></div></div>
        <p class="sta-note" id="staNote"></p>
      </div>
    </section>

    <main class="board">
      <nav class="tabs" role="tablist" aria-label="퀘스트 기간">
        <button class="tab" role="tab" id="tab-today" data-action="tab" data-tab="today" aria-controls="panel"><span class="tab-k">DAILY</span><span class="tab-n">오늘</span><span class="badge" id="badge-today"></span></button>
        <button class="tab" role="tab" id="tab-week" data-action="tab" data-tab="week" aria-controls="panel"><span class="tab-k">WEEKLY</span><span class="tab-n">이번 주</span><span class="badge" id="badge-week"></span></button>
        <button class="tab" role="tab" id="tab-month" data-action="tab" data-tab="month" aria-controls="panel"><span class="tab-k">MONTHLY</span><span class="tab-n">이번 달</span><span class="badge" id="badge-month"></span></button>
        <button class="tab" role="tab" id="tab-epic" data-action="tab" data-tab="epic" aria-controls="panel"><span class="tab-k">EPIC</span><span class="tab-n">장기 목표</span><span class="badge" id="badge-epic"></span></button>
      </nav>
      <div id="panel" role="tabpanel" aria-labelledby="tab-today">
        <div id="panelHead"></div>
        <form id="addForm" class="add window" autocomplete="off" hidden></form>
        <div id="panelBody"><p class="loading">모험 기록을 불러오는 중이에요…</p></div>
      </div>
    </main>

    <aside class="extras">
      <section class="window box" id="statsBox" aria-label="능력치"></section>
      <section class="window box" id="chartBox" aria-label="최근 7일 경험치"></section>
      <section class="window box" id="shopBox" aria-label="보물 상자">
        <div class="box-head"><h3>보물 상자</h3><span class="gold-chip" id="goldChip"></span></div>
        <div class="gacha" id="gachaBox"></div>
        <p class="note" id="gachaNote"></p>
      </section>
    </aside>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="overlay" id="cele" hidden></div>
<div class="overlay" id="modal" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="when-pop window" id="whenPop" role="dialog" aria-label="언제 할지 정하기" hidden></div>

<script src="config.js"></script>
<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const clone = o => JSON.parse(JSON.stringify(o));
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

function tween(el, from, to, dur, delay, f) {
  const token = (el._tw = (el._tw || 0) + 1);
  if (RM.matches || from === to) { el.textContent = f(to); return; }
  const t0 = performance.now() + delay;
  const step = now => {
    if (el._tw !== token) return;
    const t = Math.min(1, Math.max(0, (now - t0) / dur));
    const e = 1 - Math.pow(1 - t, 3);
    el.textContent = f(Math.round(from + (to - from) * e));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  setTimeout(() => { if (el._tw === token) el.textContent = f(to); }, delay + dur + 80);
}

  const W = innerWidth, H = innerHeight, cl = colors();
  burst(W * 0.5, H * 0.38, cl, 64, 1.7);
  setTimeout(() => { burst(W * 0.22, H * 0.55, cl, 30, 1.3); burst(W * 0.78, H * 0.55, cl, 30, 1.3); }, 240);
}
function closeCele() {
  const ov = $('#cele');
  ov.classList.remove('show');
  ov.hidden = true;
  ov.innerHTML = '';
  celeOn = false;
  if (celeQ.length) setTimeout(nextCele, 260);
}

/* ---------- effects ---------- */
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#ffc83d';
const colors = () => ['--gold', '--accent', '--c-mind', '--c-heart', '--good', '--c-body'].map(cssVar);
function toast(html, kind = '', isHTML = false) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  if (isHTML) el.innerHTML = html; else el.textContent = html;
  $('#toasts').append(el);
  const all = $('#toasts').children;
  if (all.length > 3) all[0].remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, kind === 'gold' ? 3600 : 2800);
}
function floatText(x, y, text, cls = '') {
  if (RM.matches) return;
  const el = document.createElement('div');
  el.className = 'float-txt ' + cls;
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.append(el);
  setTimeout(() => el.remove(), 1300);
}
function shake() { if (RM.matches) return; const a = $('#app'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); }
function jump() { const s = $('#sprite'); s.classList.remove('jump'); void s.offsetWidth; s.classList.add('jump'); }
function fxComplete(rect, q, xp) {
  const x = rect.left + rect.width / 2, y = rect.top + rect.height / 2;
  const sc = cssVar('--c-' + q.stat.toLowerCase()), gold = cssVar('--gold');
  burst(x, y, [sc, gold, sc, cssVar('--ink')], q.diff === 4 ? 44 : 12 + q.diff * 5, q.diff === 4 ? 1.5 : 1);
  floatText(x + 34, y - 10, `+${xp} EXP`);
  setTimeout(() => floatText(x + 34, y + 12, `+${goldOf(xp)} G`, 'coin'), 140);
  const b = $('#xpBar').getBoundingClientRect();
  orbs(x, y, b.left + b.width * 0.55, b.top + b.height / 2, Math.min(14, 4 + Math.round(xp / 8)), gold, () => {
    const bar = $('#xpBar'); bar.classList.remove('glow'); void bar.offsetWidth; bar.classList.add('glow');
  });
  jump();
  sfx(q.diff === 4 ? 'boss' : 'done');
  if (q.diff === 4) shake();
}

const fx = $('#fx'), cx = fx.getContext('2d');
let parts = [], rafId = 0, last = 0;
function sizeFx() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  fx.width = Math.round(innerWidth * dpr);
  fx.height = Math.round(innerHeight * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function burst(x, y, cols, n = 18, power = 1) {
  if (RM.matches) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (2 + Math.random() * 4.5) * power;
    parts.push({ k: 'p', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.2 * power, s: 3 + ((Math.random() * 4) | 0), c: cols[i % cols.length], life: 1, decay: 0.011 + Math.random() * 0.016 });
  }
  run();
}
function orbs(x, y, tx, ty, n, col, onArrive) {
  if (RM.matches) { if (onArrive) onArrive(); return; }
  for (let i = 0; i < n; i++) {
    parts.push({ k: 'o', x0: x + (Math.random() - 0.5) * 30, y0: y + (Math.random() - 0.5) * 20, x1: tx + (Math.random() - 0.5) * 24, y1: ty, qx: (x + tx) / 2 + (Math.random() - 0.5) * 180, qy: Math.min(y, ty) - 50 - Math.random() * 130, t: -i * 0.05, dur: 0.5 + Math.random() * 0.2, c: col, cb: i === 0 ? onArrive : null });
  }
  run();
}
function run() { if (rafId) return; last = performance.now(); rafId = requestAnimationFrame(tick); }
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const k = dt * 60;
  cx.clearRect(0, 0, innerWidth, innerHeight);
  const next = [];
  for (const p of parts) {
    if (p.k === 'p') {
      p.vy += 0.2 * k; p.vx *= Math.pow(0.985, k);
      p.x += p.vx * k; p.y += p.vy * k;
      p.life -= p.decay * k;
      if (p.life <= 0) continue;
      cx.globalAlpha = Math.min(1, p.life * 1.5);
      cx.fillStyle = p.c;
      cx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
      next.push(p);
    } else {
      p.t += dt / p.dur;
      if (p.t < 0) { next.push(p); continue; }
      const t = Math.min(1, p.t), e = t * t, u = 1 - e;
      const x = u * u * p.x0 + 2 * u * e * p.qx + e * e * p.x1;
      const y = u * u * p.y0 + 2 * u * e * p.qy + e * e * p.y1;
      cx.globalAlpha = 1;
      cx.fillStyle = p.c;
      cx.fillRect(Math.round(x) - 3, Math.round(y) - 3, 7, 7);
      cx.globalAlpha = 0.35;
      cx.fillRect(Math.round(x) - 2, Math.round(y) + 5, 4, 4);
      if (t >= 1) {
        if (p.cb) p.cb();
        for (let j = 0; j < 3; j++) next.push({ k: 'p', x: p.x1, y: p.y1, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 3, s: 3, c: p.c, life: 0.7, decay: 0.045 });
      } else next.push(p);
    }
  }
  cx.globalAlpha = 1;
  parts = next;
  if (parts.length) rafId = requestAnimationFrame(tick);
  else { rafId = 0; cx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ---------- 8-bit sound ---------- */
let AC = null;
let soundOn = lsGet('questlog.sound') !== 'off';
function paintSound() { const b = $('#soundBtn'); b.innerHTML = soundOn ? ICON.soundOn : ICON.soundOff; b.setAttribute('aria-pressed', String(soundOn)); b.title = soundOn ? '효과음 끄기' : '효과음 켜기'; }
function tone(f, t, d, type = 'square', v = 0.05) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + d + 0.03);
}
function sfx(name) {
  if (!soundOn || !name) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + 0.01;
    const seq = (notes, step, d, type, v) => notes.forEach((f, i) => tone(f, t + i * step, d, type, v));
    switch (name) {
      case 'done': seq([784, 1175], 0.07, 0.14); break;
      case 'boss': tone(98, t, 0.32, 'sawtooth', 0.06); seq([784, 988, 1319], 0.07, 0.16); break;
      case 'undo': seq([440, 294], 0.07, 0.12, 'triangle', 0.06); break;
      case 'add': seq([523, 784], 0.05, 0.08, 'triangle', 0.06); break;
      case 'coin': tone(988, t, 0.08); tone(1319, t + 0.08, 0.32); break;
      case 'perfect': seq([659, 784, 988, 1319], 0.06, 0.12, 'square', 0.04); break;
      case 'start': seq([392, 523, 659, 784], 0.08, 0.14, 'triangle', 0.06); break;
      case 'lvl': seq([523, 659, 784, 1047], 0.09, 0.16); tone(1047, t + 0.4, 0.6, 'triangle', 0.06); tone(1319, t + 0.4, 0.6, 'triangle', 0.04); break;
      case 'epic': seq([392, 392, 392, 523], 0.12, 0.14); tone(659, t + 0.5, 0.5, 'square', 0.05); tone(784, t + 0.64, 0.9, 'triangle', 0.06); break;
    }
  } catch (e) {}
}

$('#brandMark').innerHTML = ICON.quest;
$('#settingsBtn').innerHTML = ICON.gear;
$('#helpBtn').innerHTML = ICON.help;

  const k = keyOf(new Date());
  if (k !== today) { today = k; selDay = today; if (state) { if (prune()) save(); renderForm(); render(); } }
}, 30000);
boot();
})();
